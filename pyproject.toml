[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexpilot"
version = "0.1.0"
description = "An AI software engineering and DevOps assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "httpx>=0.27,<1.0", "pydantic>=2.8,<3.0", "pydantic-settings>=2.4,<3.0", "sqlalchemy>=2.0,<3.0", "typer>=0.12,<1.0", "python-dotenv>=1.0,<2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-cov>=5.0,<7.0", "ruff>=0.6,<1.0"]

[project.scripts]
nexpilot = "app.cli:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
